# Fases do domain-kit (alinhado a scripts/validate_gate.py)
# Evidências → Estratégico → Descoberta → Operacional

version: 2
kit: domain-kit

phases:
  evidencias:
    name: Evidências
    question: O que sabemos, com fonte?
    command: domain.init
    note: Primeiro scan em domain.init; domain.scan é re-sync
    requires:
      - path: products/{produto}/sources.yml
      - field: domain-status.json scan in [complete, partial, skipped]
      - or_path: products/{produto}/01-product/00-scan/scan-manifest.json
    recommended:
      - path: products/{produto}/01-product/00-scan/sintese-evidencias.md

  estrategico:
    name: Estratégico
    question: Por quê? Onde? Como falamos?
    command: domain.discover
    stages: [strategic, contexts]
    requires:
      - path: products/{produto}/01-product/01-vision/01-design-estrategico.md
      - path: products/{produto}/01-product/02-domain/desafio-negocio.md
      - path: products/{produto}/01-product/02-domain/bounded-contexts.md
      - path: products/{produto}/01-product/02-domain/linguagem-ubiqua.md

  descoberta:
    name: Descoberta
    question: Como o domínio se comporta no tempo?
    command: domain.discover
    stages: [stories, event-storming]
    requires_one_of:
      - path: products/{produto}/01-product/03-discovery/01-event-storming/
        type: directory_nonempty
      - path: products/{produto}/01-product/03-discovery/02-domain-storytelling/
        type: directory_nonempty
    modes:
      minimal:
        note: discovery opcional (warning) quando mode=minimal no validate

  operacional:
    name: Operacional
    question: Quais cenários ponta a ponta garantir?
    command: domain.model --finalize
    handoff: next_technical_step
    requires:
      - path: products/{produto}/01-product/04-operacional/requisitos.md
      - path: products/{produto}/05-decisoes/produto.md
      - fluxos_min: 1
        paths:
          - products/{produto}/01-product/04-operacional/fluxos/
          - products/{produto}/flows-registry.yml
    does_not_require:
      - products/{produto}/arch/

modes:
  full:
    skip: []
  minimal:
    skip:
      - domain_storytelling
      - event_storming
    descoberta_relaxed: true
    note: validate_gate --mode minimal → Descoberta PASS mesmo sem ES/stories (WARN stderr only)
  incremental:
    scope: delta
    note: Tático não é critério de saída do domain-kit

boundary:
  domain_kit:
    - evidencias
    - estrategico
    - descoberta
    - operacional_negocio
  out_of_scope:
    - design_tatico
    - integracao_tecnica
    - fluxos_tecnicos
    - c4_adr_database_model
